# Docker Compose Configuration for Concert API, SOAP API, and WebSocket API
# Orchestrates all .NET services with shared MySQL database

version: "3.8"

services:
  # ============================
  # Shared MySQL Database Service
  # ============================
  mysql:
    image: mysql:8.0
    container_name: apis_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: concertdb
      MYSQL_USER: concertuser
      TZ: "UTC"
    ports:
      - "3307:3306"
    volumes:
      # Persist MySQL data between container restarts
      - mysql_data:/var/lib/mysql
      # Initialize databases with SQL scripts
      - ./RestApi/ConcertApi/DBV2.0.sql:/docker-entrypoint-initdb.d/01-concert-init.sql
      - ./SoapApi/init-soapdb.sql:/docker-entrypoint-initdb.d/02-soap-init.sql
      - ./WebsocketApi/SeedData.sql:/docker-entrypoint-initdb.d/03-websocket-init.sql
    #networks:
    #- apis_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p rootpassword123",
        ]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: lotr_graphql_postgres
    environment:
      POSTGRES_PASSWORD: lotr_password
      POSTGRES_USER: lotr_user
      POSTGRES_DB: lotr_wiki_db
    ports:
      - "5432:5432"
    volumes:
      - lotr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lotr_user", "-d", "lotr_wiki_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  # ============================
  # Rest API Service
  # ============================
  restapi:
    build:
      context: ./RestApiV2
      dockerfile: Dockerfile
    container_name: apis_restapi
    environment:
      # Database Configuration via Environment Variables
      CONCERT_DB_NAME: concertdb
      CONCERT_DB_USER: root
      CONCERT_DB_USER_PASSWORD: rootpassword123
    ports:
      - "5085:5085"
    #networks:
    #- apis_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5085/swagger/index.html"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s

  # ============================
  # SOAP API Service
  # ============================
  soapapi:
    build:
      context: ./SoapApi
      dockerfile: Dockerfile
    container_name: apis_soapapi
    environment:
      # Database Configuration via Environment Variables
      SOAP_DB_NAME: soapdb
      SOAP_DB_USER: soapuser
      SOAP_DB_USER_PASSWORD: soappassword123
    ports:
      - "5298:5298"
    #networks:
    #- apis_network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "dotnet ef database update && dotnet SoapApi.dll"
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:5298/swagger/index.html"]
    #  timeout: 10s
    #  retries: 5
    #  interval: 15s
    #  start_period: 30s

  # ============================
  # WebSocket API Service
  # ============================
  websocketapi:
    build:
      context: ./WebsocketApi
      dockerfile: Dockerfile
    container_name: apis_websocketapi
    environment:
      # Database Configuration via Environment Variables
      WEBSOCKET_DB_NAME: websocketdb
      WEBSOCKET_DB_USER: websocketuser
      WEBSOCKET_DB_USER_PASSWORD: websocketpass123
    ports:
      - "5001:5001"
    #networks:
    #- apis_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--insecure",
          "https://localhost:5001/api/csrf-token",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s

  # ============================
  # gRPC API Service
  # ============================
  grpcapi:
    build:
      context: ./gRpcApi/g
      dockerfile: Dockerfile
    container_name: apis_grpcapi
    environment:
      # Database Configuration via Environment Variables
      GRPC_DB_NAME: grpcdb
      GRPC_DB_USER: grpcuser
      GRPC_DB_USER_PASSWORD: grpcpass123
    ports:
      - "5068:5068"
    #networks:
    #- apis_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--insecure",
          "https://localhost:5068/api/csrf-token",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s

  # ============================
  # GraphQL API Service
  # ============================
  graphqlapi:
    build:
      context: ./GraphQLApi/lotr-graphql-wiki/server
      dockerfile: Dockerfile
    container_name: apis_graphqlapi
    environment:
      DATABASE_URL: postgresql://lotr_user:lotr_password@postgres:5432/lotr_wiki_db?schema=public
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    #networks:
    #- apis_network
    depends_on:
      postgres:
        condition: service_healthy
    #command: sh -c "npm run start && npm run seed"
    #command: sh -c "npx prisma generate && npm run start"

# ============================
# Networks
# ============================
#networks:
# apis_network:
#driver: bridge

# ============================
# Volumes
# ============================
volumes:
  mysql_data:
    driver: local
  lotr_postgres_data:
